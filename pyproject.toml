[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autopcet"
version = "0.1.0"
description = "Automated proton-coupled electron transfer (PCET) tooling."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]
keywords = ["chemistry", "electron-transfer", "pcet", "proton-transfer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "numba>=0.67",
  "numpy>=2.5.2",
  "scipy>=1.14",
]

[project.optional-dependencies]
ase = [
  "ase>=3.23",
]
examples = [
  "matplotlib>=3.10",
  "pandas>=2.2",
]
# legacy alias for the ase extra, which the command-line helpers also need
scripts = [
  "ase>=3.23",
]

[project.scripts]
autopcet-align-average = "autopcet.cli.align_average:main"
autopcet-keff = "autopcet.cli.calc_keff:main"
autopcet-scan-da = "autopcet.cli.scan_da_distance:main"
autopcet-scan-proton = "autopcet.cli.scan_proton_coord:main"

[project.urls]
Homepage = "https://github.com/LouieSlocombe/autopcet"
Issues = "https://github.com/LouieSlocombe/autopcet/issues"
Repository = "https://github.com/LouieSlocombe/autopcet"

[dependency-groups]
dev = [
  "build>=1.5.0",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4",
  "twine>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autopcet", "autopcet.*"]

[tool.setuptools.package-data]
autopcet = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=autopcet --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
  "error",
  # ASE still reshapes arrays the way NumPy 2.5 deprecated. It fires while ASE
  # parses a structure file for the command-line helpers, and is not ours to fix.
  "ignore:Setting the shape on a NumPy array:DeprecationWarning:ase",
]

[tool.coverage.run]
branch = true
source = ["autopcet"]

[tool.coverage.report]
fail_under = 96
show_missing = true
exclude_also = [
  # numba-compiled functions cannot be traced by coverage.py
  "@jit",
  # console script entry points are exercised through their main()
  'if __name__ == "__main__":',
  # typing-only stub bodies of @overload and Protocol declarations
  '^\s*\.\.\.$',
]

[tool.ruff]
line-length = 88
src = ["."]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["autopcet", "tests"]
python_version = "3.14"
pretty = true
show_error_codes = true
strict = true
warn_unreachable = true
# ASE's Atoms methods are only partially annotated
untyped_calls_exclude = ["ase"]

[[tool.mypy.overrides]]
module = ["ase.*", "numba.*", "scipy.*"]
ignore_missing_imports = true
