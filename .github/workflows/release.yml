name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    # Trusted Publishing: PyPI mints a short-lived token from this job's OIDC
    # identity, so no API token is stored in the repository.
    environment:
      name: pypi
      url: https://pypi.org/p/autopcet
    permissions:
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      # A tag that disagrees with the version in pyproject.toml would publish
      # under the wrong number, and a version on PyPI can never be reused.
      - name: Check the tag matches the declared version
        run: |
          declared=$(python -c "
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME declares $tagged, pyproject.toml declares $declared" >&2
            exit 1
          fi
          echo "releasing version $declared"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
